name: Build Frago ARM64 from ZIP

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Optional ZIP filename/path in the repository (blank = auto-detect)'
        required: false
        type: string
        default: ''
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HEV_VERSION: '2.20.0'
      HEV_ARM64_SHA256: '88b67182d6db79e880fa9a5aee850cf9ebf094efa56cb42d195ee0308085dd42'

    steps:
      - name: Checkout repository (ZIP may be the only source file)
        uses: actions/checkout@v4

      - name: Find and extract Frago source ZIP
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/frago-source"
          mkdir -p "$EXTRACT_ROOT"

          if [[ -f "$WORKSPACE/gradlew" && -f "$WORKSPACE/settings.gradle" ]]; then
            PROJECT_DIR="$WORKSPACE"
            echo "Found an already-extracted Gradle project at repository root."
          else
            ZIP_PATH=""
            if [[ -n "${REQUESTED_SOURCE_ZIP:-}" ]]; then
              ZIP_PATH="$WORKSPACE/$REQUESTED_SOURCE_ZIP"
              [[ -f "$ZIP_PATH" ]] || { echo "Requested source ZIP not found: $ZIP_PATH"; exit 1; }
            else
              mapfile -t VALID_ZIPS < <(
                while IFS= read -r archive; do
                  if unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)gradlew$' \
                    && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)settings\.gradle$' \
                    && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)gradle/wrapper/gradle-wrapper\.jar$'; then
                    printf '%s\n' "$archive"
                  fi
                done < <(find "$WORKSPACE" -maxdepth 4 -type f -iname '*.zip' ! -path '*/.git/*' | sort)
              )
              if [[ ${#VALID_ZIPS[@]} -eq 0 ]]; then
                echo "No source ZIP containing gradlew, settings.gradle and gradle-wrapper.jar was found."
                find "$WORKSPACE" -maxdepth 3 -type f | sort | head -200
                exit 1
              elif [[ ${#VALID_ZIPS[@]} -gt 1 ]]; then
                echo "More than one Gradle source ZIP was found:"; printf ' - %s\n' "${VALID_ZIPS[@]}"
                echo "Set workflow_dispatch input source_zip to the exact ZIP path."; exit 1
              fi
              ZIP_PATH="${VALID_ZIPS[0]}"
            fi
            echo "Extracting: $ZIP_PATH"
            unzip -q "$ZIP_PATH" -d "$EXTRACT_ROOT"
            mapfile -t WRAPPERS < <(find "$EXTRACT_ROOT" -maxdepth 7 -type f -name gradlew -print | sort)
            [[ ${#WRAPPERS[@]} -eq 1 ]] || { echo "Expected one gradlew, found ${#WRAPPERS[@]}"; exit 1; }
            PROJECT_DIR="$(dirname "${WRAPPERS[0]}")"
          fi
          [[ -f "$PROJECT_DIR/settings.gradle" ]] || { echo "settings.gradle missing: $PROJECT_DIR"; exit 1; }
          [[ -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]] || { echo "Wrapper JAR missing: $PROJECT_DIR"; exit 1; }
          echo "Frago project directory: $PROJECT_DIR"
          echo "FRAGO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download and verify lightweight Hev ARM64 TUN engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          DEST="app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"
          mkdir -p "$(dirname "$DEST")"
          URL="https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel-android-arm64-v8a"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 "$URL" -o "$DEST"
          echo "${HEV_ARM64_SHA256}  ${DEST}" | sha256sum --check --status
          echo "Hev release checksum verified: ${HEV_ARM64_SHA256}"
          file "$DEST"
          readelf -h "$DEST" | grep -E 'Class:|Machine:|Type:'
          readelf -h "$DEST" | grep -q 'ELF64'
          readelf -h "$DEST" | grep -q 'AArch64'
          readelf -Ws "$DEST" | grep -q 'JNI_OnLoad'
          test "$(stat -c %s "$DEST")" -lt 600000

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mapfile -t SDKMANAGERS < <(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V)
          [[ ${#SDKMANAGERS[@]} -gt 0 ]] || { echo "sdkmanager not found"; exit 1; }
          SDKMANAGER="${SDKMANAGERS[-1]}"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          bash "$SDKMANAGER" --version

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          bash "$SDKMANAGER" --licenses < <(yes) >/dev/null
          bash "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0"

      - name: Set up JDK 11 for Gradle 7.2 / Android Gradle Plugin 7.1.3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify Fragment algorithm and source does not reference old tunnel binaries
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          python3 tools/verify-user-config.py
          bash tools/verify-fragmenter.sh
          bash tools/verify-socks5-tunnel.sh
          if grep -R -n -E 'libtun2socks|libsystem\.so|loadLibrary\("system"\)' app/src/main app/build.gradle; then
            echo "Old BadVPN tunnel references remain in source."; exit 1
          fi

      - name: Build release APK and verify native payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          chmod +x ./gradlew
          java -version
          ./gradlew --no-daemon clean verifyReleaseApkNoProxyCore
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libhev-socks5-tunnel.so'
          if unzip -l "$APK" | grep -Ei 'lib(xray|v2ray|tun2socks|system)\.so'; then
            echo "Forbidden or obsolete native tunnel library found."; exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-Hev-Fragment-APK
          path: ${{ env.FRAGO_PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
