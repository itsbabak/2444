name: Build Frago ARM64 from ZIP

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Optional ZIP filename/path in the repository (blank = auto-detect)'
        required: false
        type: string
        default: ''
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository (ZIP may be the only source file)
        uses: actions/checkout@v4

      - name: Find and extract Frago source ZIP
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/frago-source"
          mkdir -p "$EXTRACT_ROOT"

          # Also support repositories where the source was already extracted.
          if [[ -f "$WORKSPACE/gradlew" && -f "$WORKSPACE/settings.gradle" ]]; then
            PROJECT_DIR="$WORKSPACE"
            echo "Found an already-extracted Gradle project at repository root."
          else
            ZIP_PATH=""

            if [[ -n "${REQUESTED_SOURCE_ZIP:-}" ]]; then
              ZIP_PATH="$WORKSPACE/$REQUESTED_SOURCE_ZIP"
              [[ -f "$ZIP_PATH" ]] || { echo "Requested source ZIP not found: $ZIP_PATH"; exit 1; }
            else
              mapfile -t VALID_ZIPS < <(
                while IFS= read -r archive; do
                  if unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)gradlew$' \
                    && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)settings\.gradle$' \
                    && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)gradle/wrapper/gradle-wrapper\.jar$'; then
                    printf '%s\n' "$archive"
                  fi
                done < <(find "$WORKSPACE" -maxdepth 4 -type f -iname '*.zip' ! -path '*/.git/*' | sort)
              )

              if [[ ${#VALID_ZIPS[@]} -eq 0 ]]; then
                echo "No source ZIP containing gradlew, settings.gradle and gradle-wrapper.jar was found."
                echo "Put the Frago source ZIP in the repository (or configure source_zip in workflow_dispatch)."
                echo "Repository files:"
                find "$WORKSPACE" -maxdepth 3 -type f | sort | head -200
                exit 1
              elif [[ ${#VALID_ZIPS[@]} -gt 1 ]]; then
                echo "More than one Gradle source ZIP was found:"
                printf ' - %s\n' "${VALID_ZIPS[@]}"
                echo "Set the workflow_dispatch input source_zip to the exact ZIP filename/path."
                exit 1
              fi
              ZIP_PATH="${VALID_ZIPS[0]}"
            fi

            echo "Extracting source archive: $ZIP_PATH"
            unzip -q "$ZIP_PATH" -d "$EXTRACT_ROOT"
            mapfile -t WRAPPERS < <(find "$EXTRACT_ROOT" -maxdepth 7 -type f -name gradlew -print | sort)
            if [[ ${#WRAPPERS[@]} -ne 1 ]]; then
              echo "Expected exactly one gradlew in extracted source, found ${#WRAPPERS[@]}"
              find "$EXTRACT_ROOT" -maxdepth 7 -type f | sort | head -200
              exit 1
            fi
            PROJECT_DIR="$(dirname "${WRAPPERS[0]}")"
          fi

          [[ -f "$PROJECT_DIR/settings.gradle" ]] || { echo "settings.gradle missing in $PROJECT_DIR"; exit 1; }
          [[ -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]] || { echo "Gradle wrapper JAR missing in $PROJECT_DIR"; exit 1; }
          echo "Frago project directory: $PROJECT_DIR"
          echo "FRAGO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android sdkmanager
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "Android command-line tools directory not found: $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          mapfile -t SDKMANAGERS < <(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V)
          if [[ ${#SDKMANAGERS[@]} -eq 0 ]]; then
            echo "No sdkmanager executable found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          SDKMANAGER="${SDKMANAGERS[-1]}"
          # The preinstalled SDK belongs to the runner image. Do not chmod it.
          # Run the sdkmanager shell script through bash instead.
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          bash "$SDKMANAGER" --version

      - name: Accept licenses and install only required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          bash "$SDKMANAGER" --licenses < <(yes) >/dev/null
          bash "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0"

      - name: Set up JDK 11 for Gradle 7.2 / Android Gradle Plugin 7.1.3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build release APK and verify no Xray/V2Ray payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          echo "Building from: $PWD"
          java -version
          chmod +x ./gradlew
          ./gradlew --no-daemon clean verifyReleaseApkNoProxyCore
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload verified ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: ${{ env.FRAGO_PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
