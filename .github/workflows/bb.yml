name: Build Frago ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 31
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools"

      - name: Build clean release and verify APK contents
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean verifyReleaseApkNoProxyCore

      - name: Upload verified ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-verified
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
