name: Build Frago ARM64 from ZIP

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Optional ZIP filename/path in the repository (blank = auto-detect)'
        required: false
        type: string
        default: ''
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HEV_VERSION: '2.20.0'

    steps:
      - name: Checkout repository (ZIP may be the only source file)
        uses: actions/checkout@v4

      - name: Find and extract Frago source ZIP
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}
          DEFAULT_SOURCE_ZIP: Frago-Hev-Standalone-Fragment-ARM64-AAR-FIX2.zip
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/frago-source"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          if [[ -f "$WORKSPACE/gradlew" && -f "$WORKSPACE/settings.gradle" && -f "$WORKSPACE/app/build.gradle" ]]; then
            PROJECT_DIR="$WORKSPACE"
            echo "Found an already-extracted Frago project at repository root."
          else
            ZIP_PATH=""
            if [[ -n "${REQUESTED_SOURCE_ZIP:-}" ]]; then
              ZIP_PATH="$WORKSPACE/$REQUESTED_SOURCE_ZIP"
              [[ -f "$ZIP_PATH" ]] || { echo "Requested source ZIP not found: $ZIP_PATH"; exit 1; }
            elif [[ -f "$WORKSPACE/$DEFAULT_SOURCE_ZIP" ]]; then
              ZIP_PATH="$WORKSPACE/$DEFAULT_SOURCE_ZIP"
            else
              mapfile -t VALID_ZIPS < <(
                while IFS= read -r archive; do
                  if unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)gradlew$' \
                    && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)settings\.gradle$' \
                    && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)app/build\.gradle$' \
                    && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)gradle/wrapper/gradle-wrapper\.jar$'; then
                    printf '%s\n' "$archive"
                  fi
                done < <(find "$WORKSPACE" -maxdepth 4 -type f -iname '*.zip' ! -path '*/.git/*' | sort)
              )
              if [[ ${#VALID_ZIPS[@]} -eq 0 ]]; then
                echo "No Frago source ZIP containing gradlew, settings.gradle, app/build.gradle and the wrapper JAR was found."
                find "$WORKSPACE" -maxdepth 3 -type f | sort | head -200
                exit 1
              elif [[ ${#VALID_ZIPS[@]} -gt 1 ]]; then
                echo "More than one valid source ZIP was found:"
                printf ' - %s\n' "${VALID_ZIPS[@]}"
                echo "Set the workflow_dispatch input source_zip to the exact filename."
                exit 1
              fi
              ZIP_PATH="${VALID_ZIPS[0]}"
            fi

            echo "Extracting source ZIP: $ZIP_PATH"
            unzip -q "$ZIP_PATH" -d "$EXTRACT_ROOT"

            # A source archive may contain a duplicate backup folder. Do not count
            # every gradlew: identify complete Android project roots, then prefer
            # the shallowest (outermost) complete project.
            PROJECT_DIR="$(python3 - "$EXTRACT_ROOT" <<'PYPROJECT'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1]).resolve()
          candidates = []
          for settings in root.rglob('settings.gradle'):
              d = settings.parent
              required = [
                  d / 'gradlew',
                  d / 'build.gradle',
                  d / 'app' / 'build.gradle',
                  d / 'gradle' / 'wrapper' / 'gradle-wrapper.jar',
              ]
              if all(p.is_file() for p in required):
                  candidates.append((len(d.relative_to(root).parts), d))
          if not candidates:
              print('No complete Android Gradle project found after extraction.', file=sys.stderr)
              sys.exit(2)
          candidates.sort(key=lambda item: (item[0], str(item[1])))
          shallowest = candidates[0][0]
          best = [path for depth, path in candidates if depth == shallowest]
          if len(best) != 1:
              print('Ambiguous project roots at the same directory depth:', file=sys.stderr)
              for path in best:
                  print(f' - {path}', file=sys.stderr)
              sys.exit(3)
          print(best[0])
          PYPROJECT
          )"
          fi

          [[ -f "$PROJECT_DIR/gradlew" ]] || { echo "gradlew missing: $PROJECT_DIR"; exit 1; }
          [[ -f "$PROJECT_DIR/settings.gradle" ]] || { echo "settings.gradle missing: $PROJECT_DIR"; exit 1; }
          [[ -f "$PROJECT_DIR/app/build.gradle" ]] || { echo "app/build.gradle missing: $PROJECT_DIR"; exit 1; }
          [[ -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]] || { echo "Wrapper JAR missing: $PROJECT_DIR"; exit 1; }
          echo "Selected Frago project directory: $PROJECT_DIR"
          echo "gradlew count in selected project: $(find "$PROJECT_DIR" -maxdepth 1 -type f -name gradlew | wc -l)"
          echo "FRAGO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download official Hev Android AAR and extract the real ARM64 JNI library
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"

          # IMPORTANT:
          # The similarly named "hev-socks5-tunnel-android-arm64-v8a" release asset
          # is a standalone PIE executable, NOT a JNI shared library. Do not rename
          # that executable to .so. The upstream AAR contains the correct shared object.
          AAR="$RUNNER_TEMP/hev-socks5-tunnel.aar"
          URL="https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel.aar"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 "$URL" -o "$AAR"

          ENTRY="jni/arm64-v8a/libhev-socks5-tunnel.so"
          unzip -Z1 "$AAR" | grep -Fx "$ENTRY" >/dev/null || {
            echo "Official Hev AAR does not contain expected ARM64 JNI library: $ENTRY"
            unzip -Z1 "$AAR" | sed -n '1,120p'
            exit 1
          }

          DEST="app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"
          mkdir -p "$(dirname "$DEST")"
          unzip -p "$AAR" "$ENTRY" > "$DEST"
          test -s "$DEST"

          echo "Downloaded official Hev AAR; AAR SHA-256: $(sha256sum "$AAR" | awk '{print $1}')"
          echo "Extracted ARM64 JNI shared object: $DEST"
          file "$DEST"

          # Reject PIE executables: an Android JNI .so must be a shared object
          # without PT_INTERP, and it must export JNI_OnLoad.
          file "$DEST" | grep -qi 'shared object' || {
            echo "Hev payload is not an ELF shared object (it may be the standalone PIE executable)."
            exit 1
          }
          readelf -h "$DEST" > "$RUNNER_TEMP/hev-elf-header.txt"
          grep -q 'ELF64' "$RUNNER_TEMP/hev-elf-header.txt"
          grep -q 'AArch64' "$RUNNER_TEMP/hev-elf-header.txt"
          readelf -l "$DEST" > "$RUNNER_TEMP/hev-elf-program-headers.txt"
          if grep -q 'INTERP' "$RUNNER_TEMP/hev-elf-program-headers.txt"; then
            echo "Unexpected PT_INTERP: this is an executable, not a loadable JNI shared library."
            exit 1
          fi
          readelf -Ws "$DEST" > "$RUNNER_TEMP/hev-elf-symbols.txt"
          grep -q 'JNI_OnLoad' "$RUNNER_TEMP/hev-elf-symbols.txt" || {
            echo "JNI_OnLoad symbol missing from Hev shared library."
            exit 1
          }
          strings "$DEST" > "$RUNNER_TEMP/hev-strings.txt"
          grep -Fq 'hev/htproxy/TProxyService' "$RUNNER_TEMP/hev-strings.txt" || {
            echo "Hev JNI package/class does not match hev.htproxy.TProxyService."
            exit 1
          }
          test "$(stat -c %s "$DEST")" -lt 1200000

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mapfile -t SDKMANAGERS < <(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V)
          [[ ${#SDKMANAGERS[@]} -gt 0 ]] || { echo "sdkmanager not found"; exit 1; }
          SDKMANAGER="${SDKMANAGERS[-1]}"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          bash "$SDKMANAGER" --version

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          bash "$SDKMANAGER" --licenses < <(yes) >/dev/null
          bash "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0"

      - name: Set up JDK 11 for Gradle 7.2 / Android Gradle Plugin 7.1.3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify Fragment algorithm and source does not reference old tunnel binaries
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          python3 tools/verify-user-config.py
          bash tools/verify-fragmenter.sh
          bash tools/verify-socks5-tunnel.sh
          if grep -R -n -E 'libtun2socks|libsystem\.so|loadLibrary\("system"\)' app/src/main app/build.gradle; then
            echo "Old BadVPN tunnel references remain in source."; exit 1
          fi

      - name: Build release APK and verify native payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          chmod +x ./gradlew
          java -version
          ./gradlew --no-daemon clean verifyReleaseApkNoProxyCore
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libhev-socks5-tunnel.so'
          if unzip -l "$APK" | grep -Ei 'lib(xray|v2ray|tun2socks|system)\.so'; then
            echo "Forbidden or obsolete native tunnel library found."; exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-Hev-Fragment-APK
          path: ${{ env.FRAGO_PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
